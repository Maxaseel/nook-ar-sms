name: Android Release APK (Unsigned)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish unsigned release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK without a signature
        run: ./gradlew --no-daemon assembleRelease -PunsignedRelease=true -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Verify APK and create checksum
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo "Expected release APK not found"; exit 1; }
          if apksigner verify "$APK"; then
            echo "ERROR: APK unexpectedly contains a signature" >&2
            exit 1
          fi
          sha256sum "$APK" > app-release-unsigned.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NooK ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            This release contains an **unsigned APK** as requested. Android will not install an unsigned APK directly. Sign it with a trusted key before installation; upgrades also require the same signing key used for the installed app.
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app-release-unsigned.apk.sha256
