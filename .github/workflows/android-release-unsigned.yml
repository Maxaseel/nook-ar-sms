name: Android Release APK (Unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-release:
    name: Build unsigned Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned Release APK
        run: ./gradlew --no-daemon assembleRelease -PunsignedRelease=true

      - name: Verify APK exists and is unsigned
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo "Expected unsigned APK not found: $APK"; find app/build/outputs/apk -type f -print; exit 1; }
          if apksigner verify "$APK"; then
            echo "ERROR: APK unexpectedly contains a signature" >&2
            exit 1
          else
            echo "Confirmed: the release APK has no APK signature."
          fi
          sha256sum "$APK"

      - name: Upload unsigned Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-release-unsigned-v1.7.8.298
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
